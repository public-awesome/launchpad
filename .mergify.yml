queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>2"
      - base=main
      - label=automerge
    merge_conditions:
      - "#approved-reviews-by>2"
    commit_message_format:
      title: pr-title
      body: pr-body
    merge_method: squash

pull_request_rules:
  - name: backport to v2
    conditions:
      - base=main
      - label=backport/2.x
    actions:
      backport:
        branches:
          - release/v2.x
  - name: automerge to main if approved and labeled
    conditions: []
    actions:
      queue:
